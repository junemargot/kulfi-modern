spring:
  application:
    name: kulfi-api
  
  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:kulfi}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:kulfi}
    password: ${MYSQL_PASSWORD:kulfi1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:kulfi}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    user: ${MYSQL_USER:kulfi}
    password: ${MYSQL_PASSWORD:kulfi1234}

  data:
    redis:
      host: localhost
      port: 6379
  
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  
  security:
    user:
      name: admin
      password: admin

# JWT
jwt:
  secret: ${JWT_SECRET:kulfi-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# Logging
logging:
  level:
    com.kulfi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
